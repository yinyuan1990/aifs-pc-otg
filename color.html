<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #E8EDE7;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .color-box {
            width: 200px;
            height: 60px;
            margin: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #999;
        }
        .row {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>选择灰度背景色</h2>
    
    <div class="row">
        <div class="color-box" style="background: #F0F0F0; color: #333;">#F0F0F0 (当前)</div>
        <div class="color-box" style="background: #E8E8E8; color: #333;">#E8E8E8</div>
        <div class="color-box" style="background: #E0E0E0; color: #333;">#E0E0E0</div>
        <div class="color-box" style="background: #D8D8D8; color: #333;">#D8D8D8</div>
    </div>
    
    <div class="row">
        <div class="color-box" style="background: #D0D0D0; color: #333;">#D0D0D0</div>
        <div class="color-box" style="background: #C8C8C8; color: #333;">#C8C8C8</div>
        <div class="color-box" style="background: #C0C0C0; color: #333;">#C0C0C0</div>
        <div class="color-box" style="background: #B8B8B8; color: #333;">#B8B8B8</div>
    </div>
    
    <div class="row">
        <div class="color-box" style="background: #B0B0B0; color: #333;">#B0B0B0</div>
        <div class="color-box" style="background: #A0A0A0; color: #333;">#A0A0A0</div>
        <div class="color-box" style="background: #909090; color: #333;">#909090</div>
        <div class="color-box" style="background: #808080; color: #fff;">#808080</div>
    </div>
    
    <div class="row">
        <div class="color-box" style="background: #707070; color: #fff;">#707070</div>
        <div class="color-box" style="background: #606060; color: #fff;">#606060</div>
        <div class="color-box" style="background: #505050; color: #fff;">#505050</div>
        <div class="color-box" style="background: #404040; color: #fff;">#404040</div>
    </div>
    
    <div class="row">
        <div class="color-box" style="background: #353535; color: #fff;">#353535</div>
        <div class="color-box" style="background: #2D2D2D; color: #fff;">#2D2D2D</div>
        <div class="color-box" style="background: #252525; color: #fff;">#252525</div>
        <div class="color-box" style="background: #1F1F1F; color: #fff;">#1F1F1F (最深)</div>
    </div>
    
</body>
</html>
